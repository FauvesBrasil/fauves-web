  <circle cx="53" cy="125" r="4" fill="none" stroke="#fff" stroke-width="1"/>
  <text x="62" y="129" fill="#fff" font-size="9" font-weight="bold" font-family="system-ui, sans-serif">fauves/calendar</text>
</svg>