<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>OAuth callback</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
  </head>
  <body>
    <script>
      (function(){
        try {
          const params = new URLSearchParams(window.location.search);
          const token = params.get('auth_token') || params.get('token');
          if (token) {
            // If opened as a popup by the main app, postMessage the token and close
            try {
              if (window.opener && !window.opener.closed) {
                // The callback and the Fauves app must share the same frontend origin.
                // Never send an authentication token to an arbitrary opener.
                try { window.opener.postMessage({ type: 'fauves_oauth', token }, window.location.origin); } catch(e) { /* ignore */ }
                // Also persist to localStorage as a fallback
                try { localStorage.setItem('AUTH_TOKEN_V1', token); } catch(e) {}
                window.close();
                return;
              }
            } catch(e) {}

            // Not a popup: preserve the page that initiated login, defaulting to the authenticated home.
            let destination = '/events';
            try {
              const pending = sessionStorage.getItem('FAUVES_OAUTH_REDIRECT');
              if (pending && pending.startsWith('/') && !pending.startsWith('//')) destination = pending;
              sessionStorage.removeItem('FAUVES_OAUTH_REDIRECT');
              sessionStorage.setItem('FAUVES_LOGIN_WELCOME_PENDING', 'true');
            } catch(e) {}
            const separator = destination.includes('?') ? '&' : '?';
            window.location.replace(destination + separator + 'auth_token=' + encodeURIComponent(token));
            return;
          }
        } catch (e) {}
        // Nothing to do
        document.body.innerText = 'OAuth callback received no token.';
      })();
    </script>
  </body>
</html>
